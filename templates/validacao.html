<!DOCTYPE html>
<html>
<head>
    <title>Validação de idade</title>
</head>

<body>

    <h1>Validação de idade</h1>

    <form method="POST">

        <label>Nome:</label>
        <input type="text" name="nome" required>

        <br><br>

        <label>Sobrenome:</label>
        <input type="text" name="sobrenome" required>

        <br><br>

        <label>Idade:</label>
        <input type="number" name="idade" required>

        <br><br>

        <button type="submit">Verificar</button>

    </form>

    {% if resultado %}

        <h2>Resultado</h2>

        <p>Nome: {{ resultado.nome }} {{ resultado.sobrenome }}</p>
        <p>Idade: {{ resultado.idade }}</p>

        <p>Votação: {{ resultado.votar }}</p>
        <p>Direção: {{ resultado.dirigir }}</p>

    {% endif %}

</body>
</html>
